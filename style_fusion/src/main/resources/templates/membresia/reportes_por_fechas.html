<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes de Membresías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Reporte por Plan de Membresía</h2>
        <a th:href="@{/membresia}" class="btn btn-secondary">Volver a Membresías</a>
    </div>

    <!-- Formulario de filtros por fecha -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/membresia/reportes_por_fechas}" method="get" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="fechaInicio" class="form-label">Fecha inicio</label>
                    <input type="date"
                           id="fechaInicio"
                           name="fechaInicio"
                           class="form-control"
                           th:value="${fechaInicio != null ? #temporals.format(fechaInicio, 'yyyy-MM-dd') : ''}">
                </div>

                <div class="col-md-4">
                    <label for="fechaFin" class="form-label">Fecha fin</label>
                    <input type="date"
                           id="fechaFin"
                           name="fechaFin"
                           class="form-control"
                           th:value="${fechaFin != null ? #temporals.format(fechaFin, 'yyyy-MM-dd') : ''}">
                </div>

                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Filtrar</button>
                    <a th:href="@{/membresia/reportes_por_fechas}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de resultados -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Plan de Membresía</th>
                        <th class="text-center">Cantidad Vendida</th>
                        <th class="text-end">Total Recaudado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(reporte)}">
                        <td colspan="3" class="text-center text-muted py-4">
                            No hay datos para el rango de fechas seleccionado.
                        </td>
                    </tr>

                    <tr th:each="item : ${reporte}">
                        <td th:text="${item.nombrePlan}">Plan Mensual</td>
                        <td class="text-center" th:text="${item.cantidadVendida}">10</td>
                        <td class="text-end"
                            th:text="${#numbers.formatDecimal(item.totalRecaudado, 1, 'COMMA', 2, 'POINT')}">
                            0.00
                        </td>
                    </tr>
                </tbody>
                <tfoot class="table-group-divider fw-bold">
                    <tr>
                        <td colspan="2" class="text-end">Total General Recaudado:</td>
                        <td class="text-end text-success"
                            th:text="${#numbers.formatDecimal(totalGeneral, 1, 'COMMA', 2, 'POINT')}">
                            0.00
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
</body>
</html>
