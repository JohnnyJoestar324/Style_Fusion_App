<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec=http://www.thymeleaf.org/extras/spring-security >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Acceso denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm text-center p-4 p-md-5">
                    <div class="mb-3">
                        <span class="badge text-bg-danger fs-6 px-3 py-2 rounded-pill">
                            Error 403
                        </span>
                    </div>

                    <h1 class="h2 fw-bold text-dark mb-2">Acceso denegado</h1>

                    
                    <p class="text-secondary mb-4"
                       th:text="${mensajeError != null ? mensajeError : 'No tienes los permisos necesarios para ver esta página o realizar esta acción.'}">
                        No tienes los permisos necesarios para ver esta página o realizar esta acción.
                    </p>

                    <div class="alert alert-warning text-start small mb-4" role="alert">
                        <strong>Detalle:</strong>
                        <span th:text="${detalleError != null ? detalleError : 'Tu sesión actual está activa, pero tu rol no tiene acceso a este recurso.'}">
                            Tu sesión actual está activa, pero tu rol no tiene acceso a este recurso.
                        </span>
                    </div>

                    <div   class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                        <a sec:authorize="hasRole('ADMIN')" th:href="@{/home}" class="btn btn-primary px-4">Ir al inicio</a>

                        <a sec:authorize="hasRole('CLIENTE')" th:href="@{/home_negocio}" class="btn btn-primary px-4">Ir al inicio</a>

                        <button type="button" class="btn btn-outline-secondary px-4" onclick="history.back()">
                            Volver atrás
                        </button>

                        
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger px-4 w-100">
                                Cerrar sesión
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
